#          context: .
#          platforms: linux/amd64,linux/arm64
#          push: true
#          file: Dockerfile.caddy-proxy
#          tags: persapiens/account-backend:caddy-openjdk-alpine
#          build-args: |
#            POSTGRES_HOSTNAME=172.17.0.1
